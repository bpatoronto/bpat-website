    <!-- Structured data: FAQPage (brand queries surface these in SERPs) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "What is BPAT?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "BPAT stands for the Bike Parking Alliance of Toronto. We're a grassroots group that maps where bike parking is missing in Toronto and works directly with property owners to get racks installed."
            }
          },
          {
            "@type": "Question",
            "name": "What does BPAT stand for?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "BPAT stands for Bike Parking Alliance of Toronto. We advocate for secure, abundant bicycle parking across the city."
            }
          },
          {
            "@type": "Question",
            "name": "How does BPAT work?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "BPAT follows three steps: (1) Map the gaps — we document where bike parking is missing and who owns the property. (2) Make the case — we bring owners the case for bike racks: low cost, unused space, vendors included. (3) Get racks in the ground — owner says yes, the rack goes in."
            }
          },
          {
            "@type": "Question",
            "name": "Where does BPAT operate?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "BPAT operates across Toronto, Ontario, Canada. We focus on suburban plazas and older apartment buildings — the two areas with the worst bike parking gaps."
            }
          },
          {
            "@type": "Question",
            "name": "How can I get involved with BPAT?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Visit bpat.ca or email bpat.toronto@gmail.com. You can also follow us on Instagram (@bpat.toronto), X (@BPAT_Toronto), or Bluesky (bpat-toronto.bsky.social)."
            }
          }
        ]
      }

    <noscript>
      <h1>BPAT – Bike Parking Alliance of Toronto</h1>
      <p>BPAT (Bike Parking Alliance of Toronto) maps where Toronto is missing bike parking and works directly with property owners to get racks installed. We focus on suburban plazas and older apartment buildings — the two areas with the worst bike parking gaps.</p>
      <h2>How BPAT works</h2>
      <p>Step 1: Map the gaps. Step 2: Make the case to owners. Step 3: Get racks in the ground.</p>
      <h2>What does BPAT stand for?</h2>
      <p>BPAT stands for Bike Parking Alliance of Toronto — a grassroots cycling advocacy group in Toronto, Canada.</p>
      <p>Contact: <a href="mailto:bpat.toronto@gmail.com">bpat.toronto@gmail.com</a> | <a href="https://bpat.ca">bpat.ca</a></p>
